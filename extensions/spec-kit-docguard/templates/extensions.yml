# DocGuard Extension Hooks for Spec Kit
# Place this file at .specify/extensions.yml in your project root
# to integrate DocGuard into the spec-kit workflow.
#
# DocGuard will automatically run as a quality gate after implementation
# and preflight lifecycle state before specification and task generation.

schema_version: "1.0"

extension: docguard

hooks:
  # Brief current and retired spec intent before /speckit.specify starts.
  before_specify:
    - extension: docguard
      command: speckit.docguard.brief
      description: "Load current spec intent and block specification on stale lifecycle state"
      enabled: true
      optional: false

  # Run DocGuard guard after /speckit.implement completes
  # This ensures documentation stays in sync with code changes
  after_implement:
    - extension: docguard
      command: speckit.docguard.guard
      description: "Validate documentation passes CDD standards after implementation"
      enabled: true
      optional: false
      priority: 5
    - extension: docguard
      command: speckit.docguard.complete
      description: "Plan reviewed lifecycle verification after implementation"
      enabled: true
      optional: true
      priority: 10
      prompt: "Review evidence and plan this spec's completion transaction?"

  after_converge:
    - extension: docguard
      command: speckit.docguard.complete
      description: "Plan reviewed lifecycle verification after convergence"
      enabled: true
      optional: true
      prompt: "Review evidence and plan this converged spec's completion transaction?"

  # Gate the generated spec before /speckit.tasks creates implementation work.
  before_tasks:
    - extension: docguard
      command: speckit.docguard.preflight
      description: "Gate the generated spec against registry integrity and prior intent"
      enabled: true
      optional: false

  # Run DocGuard guard after /speckit.tasks to validate doc coverage
  after_tasks:
    - extension: docguard
      command: speckit.docguard.score
      description: "Show CDD maturity score after task generation"
      enabled: true
      optional: true
      prompt: "Check CDD maturity score after task generation?"
