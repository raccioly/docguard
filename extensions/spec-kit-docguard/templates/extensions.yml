# DocGuard hook registration for Spec Kit (manual installs only).
# @implements docguard.extension-manifest-hygiene#FR-004
#
# `specify extension add docguard` (or `docguard init`, or
# `npm run speckit:dev` in this repository) writes this for you. Copy it to
# .specify/extensions.yml only when installing without the specify CLI, and
# merge it into an existing file rather than replacing one.
#
# This is the exact shape Spec Kit 1.0.13 writes; tests/hooks-contract.test.mjs
# keeps its hooks equal to extension.yml.

installed:
- docguard
settings:
  auto_execute_hooks: true
hooks:
  before_specify:
  - extension: docguard
    command: speckit.docguard.brief
    enabled: true
    optional: false
    priority: 5
    prompt: Execute speckit.docguard.brief?
    description: Load current spec intent and block specification on stale lifecycle
      state
    condition: null
  after_implement:
  - extension: docguard
    command: speckit.docguard.guard
    enabled: true
    optional: false
    priority: 5
    prompt: Execute speckit.docguard.guard?
    description: Quality gate — ensures docs stay in sync with code
    condition: null
  - extension: docguard
    command: speckit.docguard.complete
    enabled: true
    optional: true
    priority: 10
    prompt: Review evidence and plan this spec's completion transaction?
    description: Plan lifecycle verification after implementation
    condition: null
  after_converge:
  - extension: docguard
    command: speckit.docguard.complete
    enabled: true
    optional: true
    priority: 10
    prompt: Review evidence and plan this converged spec's completion transaction?
    description: Plan lifecycle verification after convergence
    condition: null
  before_tasks:
  - extension: docguard
    command: speckit.docguard.preflight
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.docguard.preflight?
    description: Gate the generated spec before task generation
    condition: null
  after_tasks:
  - extension: docguard
    command: speckit.docguard.score
    enabled: true
    optional: true
    priority: 10
    prompt: Show CDD maturity score after task generation?
    description: Show CDD maturity score after task generation
    condition: null
