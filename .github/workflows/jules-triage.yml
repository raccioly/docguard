name: Jules PR Triage

# Closes Google Jules PRs that are noise, duplicates, previously declined
# work, over the review queue cap, or off their routine's contract; labels the
# rest for a maintainer or as eligible for auto-merge. Every decision is made
# by .github/scripts/jules-policy.mjs (pure, unit-tested in
# tests/jules-policy.test.mjs; specs/067-jules-policy). No rule looks at what a
# PR is about, so a real security or speed fix reaches a maintainer.
#
# SECURITY: pull_request_target carries write scope (to label, comment and
# close), so nothing here checks out or runs PR code. The checkout is the
# default branch, credentials are not persisted, and the PR is read through
# the API only. (Matches the AGENTS.md CI rule.)
#
# @implements docguard.jules-policy#FR-004
# @implements docguard.jules-policy#FR-005
# @implements docguard.jules-policy#FR-006
# @implements docguard.jules-policy#FR-007

on:
  pull_request_target:
    types: [opened, reopened]

# Read by default; the job asks to label, comment and close
# (specs/068-release-least-privilege, tests/workflow-permissions.test.mjs).
permissions:
  contents: read

# One at a time: duplicate detection compares a PR with the ones before it.
concurrency:
  group: jules-triage
  cancel-in-progress: false

jobs:
  triage:
    # Only act on the Jules bot's PRs; everything else is untouched.
    if: github.event.pull_request.user.login == 'google-labs-jules[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check out the policy from the default branch (never the PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Triage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/jules-triage.mjs`);
            await run({ github, context, core });
