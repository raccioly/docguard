name: Supply-Chain Security

on:
  workflow_dispatch: # Manual recovery for admin-bypass pushes that don't auto-trigger
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 12 * * 1'  # Mondays at 12:30 UTC
  push:
    branches: [main]

# Read by default; each scan asks for security-events: write to upload SARIF
# (specs/068-release-least-privilege, tests/workflow-permissions.test.mjs).
permissions:
  contents: read

jobs:
  osv-scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0

  osv-scan-scheduled:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0

  websec:
    # Dogfoods raccioly/websec-validator: SCA + secrets + IaC misconfig in one
    # pass, normalized and deduplicated across tools, with SARIF into the
    # Security tab.
    #
    # The scanner binaries are installed HERE, not by the action. websec skips
    # any scanner whose binary is absent (`shutil.which` → continue), so a
    # failed install would otherwise yield a green "0 findings" from a scan that
    # never ran. `scanners:` names the two this job depends on and
    # `require-complete:` turns a missing or incomplete one into exit 2 —
    # distinct from fail-on's exit 1, so "gate broken" never reads as "repo clean".
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed like OSV-Scanner below: a pinned release verified against its
      # published checksums, outside the workspace the scan reads. From
      # 2026-11-04 aquasecurity/setup-trivy's install script failed (curl exit 6)
      # while GitHub release downloads on the same runners kept working.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o trivy_checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" trivy_checksums.txt | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Install OSV-Scanner
        env:
          OSV_VERSION: v2.6.0
        run: |
          base="https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}"
          curl -sSfL -o osv-scanner "${base}/osv-scanner_linux_amd64"
          curl -sSfL -o SHA256SUMS "${base}/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' SHA256SUMS \
            | sed 's/osv-scanner_linux_amd64/osv-scanner/' \
            | sha256sum -c -
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner

      - name: websec-validator
        uses: raccioly/websec-validator@8e8de435ad9f2651de70b421f9963d4d75ed7918 # v0.22.3
        with:
          scan: "true"
          scanners: "trivy,osv-scanner"
          require-complete: "true"
          # Report-only until the noise floor is known. Raise to "high" (or add a
          # committed findings-ledger.json baseline and gate only on NEW findings)
          # once a few runs have been read.
          fail-on: ""
          # Disabled pending a websec-validator fix: 6 of its 28 results carry no
          # `locations` (4x websec/iac from Trivy's Dockerfile checks, plus
          # websec/incomplete-hsts and websec/csrf, which are absence-of-header
          # findings with nothing to anchor to). Code Scanning rejects the whole
          # upload with "locationFromSarifResult: expected at least one location".
          # Re-enable once every result carries a location.
          upload-sarif: "false"
