name: Auto Release — Tag, GitHub Release, npm, PyPI

# Triggers on push to main — detects version bumps automatically
on:
  workflow_dispatch: # Allow manual trigger for recovery
  push:
    branches: [main]
    paths:
      - 'package.json' # Only run when package.json changes (version bump)

permissions:
  contents: write # Needed to create tags and releases

jobs:
  # ── Step 1: Detect if version changed ──────────────────────────────────
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1 # only need HEAD's package.json; the tag check hits the remote

      - name: Check if this version needs releasing
        id: check
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TAG="v${CURRENT}"
          echo "current=$CURRENT"
          # TAG-DRIVEN gate (not HEAD~1): a version needs releasing iff no tag
          # v$CURRENT exists yet. The old HEAD~1 comparison skipped the release
          # whenever a push carried commits AFTER the version-bump commit (the
          # bump wasn't the tip) — e.g. a batched push of several commits. It saw
          # HEAD and HEAD~1 both already carrying the new version and wrongly
          # concluded "unchanged", silently skipping npm/PyPI/GitHub-Release.
          # Checking the tag is also idempotent: a re-run won't double-publish.
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG$"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ $TAG already released — nothing to do"
          else
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ $TAG is not yet released — releasing"
          fi

  # ── Step 2: Run full test suite ────────────────────────────────────────
  test:
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 = npm 11 coverage (18/20/22 ship npm 10). Gates releases on the
        # newer npm so a version-incompatible .npmrc / install can't ship (bug-198).
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
      - name: Guard (self-check)
        run: node cli/docguard.mjs guard || [ $? -eq 2 ]

  # ── Step 3: Create git tag + GitHub Release ────────────────────────────
  create-release:
    needs: [detect-version, test]
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: v${{ needs.detect-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history + tags for reliable tag detection

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          TAG="v${VERSION}"

          # Check if tag already exists on remote (not just local)
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "✅ Tag $TAG already exists on remote, skipping tag creation"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "✅ Tag $TAG created and pushed"
          fi

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          # Matches from ## [X.X.X] until the next ## [
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION} — see CHANGELOG.md for details."
          fi
          # Write to file to avoid escaping issues
          echo "$NOTES" > /tmp/release-notes.md
          echo "✅ Release notes extracted"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          TAG="v${VERSION}"
          # Skip if release already exists (e.g., manually created)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✅ Release $TAG already exists, skipping"
          else
            gh release create "$TAG" \
              --title "DocGuard $TAG" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

  # ── Step 4: Build and attach spec-kit extension ZIP ────────────────────
  build-extension:
    needs: [detect-version, create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build extension ZIP
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          cd extensions/spec-kit-docguard
          zip -r "../../spec-kit-docguard-v${VERSION}.zip" . -x ".*"
          cd ../..
          echo "--- ZIP contents ---"
          unzip -l "spec-kit-docguard-v${VERSION}.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          gh release upload "v${VERSION}" \
            "spec-kit-docguard-v${VERSION}.zip" \
            --clobber

  # ── Step 4c: Publish the MCP server image to GHCR ──────────────────────
  # The Dockerfile already existed but was only ever built FROM SOURCE by MCP
  # directory inspectors (Glama et al.) on every check, and was undocumented.
  # Publishing it means they (and CI users) can pull a prebuilt image instead.
  #
  # GHCR, not GitHub's npm registry: public GHCR images pull with NO auth,
  # whereas npm.pkg.github.com requires a PAT even for public packages — which
  # would make it strictly worse than npmjs.com and purely cosmetic.
  #
  # NOTHING depends on this job, so a failure here cannot block npm, PyPI, the
  # GitHub Release, or the catalog reminder — they all run in parallel. It is
  # deliberately NOT `continue-on-error`, because that reports a failed job as
  # successful and would hide a broken image behind a green run.
  #
  # Uses the docker CLI (preinstalled on the runner) rather than third-party
  # actions: two separate action-pin problems bit this pipeline today
  # (@babel/parser major, and a pypa action too old for metadata 2.5), and this
  # needs no action versions at all. Auth is GITHUB_TOKEN — nothing to expire.
  publish-ghcr:
    needs: [detect-version, test, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          # GHCR requires a lowercase path; github.repository is already
          # lowercase here but normalise anyway so a future rename can't break it.
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "Building $IMAGE:$VERSION"
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .

          # Prove the image actually starts before publishing it. The entrypoint
          # is an stdio MCP server, so it blocks waiting on stdin — feed it a
          # JSON-RPC initialize and require a response rather than just checking
          # the container didn't exit.
          echo "Smoke-testing the image..."
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          OUT="$(echo "$REQ" | timeout 60 docker run -i --rm "$IMAGE:$VERSION" 2>/dev/null | head -1 || true)"
          echo "response: ${OUT:0:200}"
          echo "$OUT" | grep -q '"jsonrpc"' || { echo "::error::Image did not answer an MCP initialize over stdio — not publishing."; exit 1; }

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:$VERSION and :latest"

  # ── Step 4b: Build and attach Claude Desktop extension (.mcpb) ─────────
  # One-click local install for Claude Desktop (Settings → Extensions).
  # Stages the exact npm-pack payload + the one production dep, stamps the
  # manifest template, and packs with the official @anthropic-ai/mcpb tool
  # (its schema is strict — the template must contain no unknown keys).
  build-mcpb:
    needs: [detect-version, create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Stage and pack .mcpb
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          npm pack --pack-destination /tmp
          mkdir -p /tmp/mcpb && tar xzf /tmp/docguard-cli-*.tgz -C /tmp/mcpb
          cd /tmp/mcpb/package
          npm install --omit=dev --no-audit --no-fund
          sed "s/__VERSION__/${VERSION}/" "$GITHUB_WORKSPACE/mcpb/manifest.template.json" > manifest.json
          npx -y @anthropic-ai/mcpb pack . "/tmp/docguard-v${VERSION}.mcpb"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          gh release upload "v${VERSION}" \
            "/tmp/docguard-v${VERSION}.mcpb" \
            --clobber

  # ── Step 5: Publish to npm ─────────────────────────────────────────────
  publish-npm:
    needs: [detect-version, test, create-release]
    runs-on: ubuntu-latest
    # Provenance attestation needs an OIDC token: npm exchanges it with
    # Sigstore to sign a statement that THIS tarball was built by THIS
    # workflow from THIS commit. That's what supply-chain checks (npm's
    # "Provenance" badge, Claude Code's unknown-package legitimacy check,
    # socket.dev, etc.) verify — without it the package is unattributable.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # MUST be >= 22.14.0. npm Trusted Publishing (OIDC) requires
          # npm CLI >= 11.5.1 AND Node >= 22.14.0, per npm's own docs.
          # This job ran Node 20 for five straight failed releases
          # (v0.34.1 - v0.34.5): below that floor npm never even ATTEMPTS the
          # OIDC exchange, it just falls through to token auth. That produced
          # two red herrings in sequence -- E404 "not found or you do not have
          # permission" while an empty _authToken was present, then ENEEDAUTH
          # once it wasn't -- neither of which names the actual cause.
          node-version: 24
          # NO registry-url, deliberately, and this combination has never
          # actually been tried before. Tracing every failed run:
          #   v0.34.4  Node 20 + registry-url  -> E404      (Node too old for
          #                                                  OIDC; empty token
          #                                                  used instead)
          #   v0.34.5  Node 20 + no registry   -> ENEEDAUTH (no token at all,
          #                                                  Node still too old)
          #   v0.34.6  Node 24 + registry-url  -> E404      (Node fine, but the
          #                                                  empty _authToken
          #                                                  setup-node writes
          #                                                  took the token path)
          # Each run had exactly ONE of the two blockers. Node >= 22.14 clears
          # the OIDC floor; omitting registry-url stops setup-node writing
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, which with
          # NODE_AUTH_TOKEN unset expands to an EMPTY token that npm still
          # treats as configured auth. npm defaults to registry.npmjs.org
          # anyway, so nothing is lost by omitting it.

      # Belt and braces: Node 24 already bundles npm >= 11.5.1, but pin
      # explicitly so a runner-image change can't silently drop below the
      # floor. npm@11 (not @latest) -- npm 12 raised its own Node floor, and
      # an unpinned "latest" is exactly how bug-258 happened.
      - run: npm install -g npm@11

      # Assert the OIDC preconditions up front, rather than discovering a
      # violation three minutes later as an unrelated-looking auth error.
      - name: Assert Trusted Publishing preconditions
        run: |
          NPM_V=$(npm --version)
          echo "node=$(node -p 'process.versions.node') npm=$NPM_V"
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (!(maj > 22 || (maj === 22 && min >= 14))) {
              console.error(`::error::Node ${process.versions.node} is below the 22.14.0 floor npm Trusted Publishing requires. OIDC is silently not attempted below it and publish fails as an auth error.`);
              process.exit(1);
            }
          '
          node -e '
            const v = process.argv[1].split(".").map(Number);
            if (!(v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1))))) {
              console.error(`::error::npm ${process.argv[1]} is below the 11.5.1 floor npm Trusted Publishing requires.`);
              process.exit(1);
            }
          ' "$NPM_V"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is unset — this job lacks id-token: write, so no OIDC token can be minted."
            exit 1
          fi
          echo "OIDC preconditions satisfied."

      # Diagnostics. Six releases have failed here on a generic 404 that never
      # names the real cause, so capture the auth state BEFORE publishing
      # rather than inferring it from the failure afterwards.
      - name: Diagnose npm auth state
        run: |
          echo "--- versions ---"
          echo "node=$(node -p 'process.versions.node')  npm=$(npm --version)"
          echo "--- OIDC env present? (values intentionally not printed) ---"
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo "ACTIONS_ID_TOKEN_REQUEST_URL: set" || echo "ACTIONS_ID_TOKEN_REQUEST_URL: MISSING"
          [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: set" || echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: MISSING"
          echo "--- resolved registry ---"
          npm config get registry
          echo "--- .npmrc files (token VALUES redacted, presence shown) ---"
          USERCONFIG=$(npm config list | sed -n 's/^userconfig = "\(.*\)"$/\1/p')
          for f in "$USERCONFIG" ".npmrc" "$HOME/.npmrc"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              echo "  [$f]"
              sed -E 's/(_authToken=).*/\1<REDACTED-OR-EMPTY>/' "$f" | sed 's/^/    /'
            else
              echo "  [$f] (absent)"
            fi
          done

      # No --provenance flag and no NODE_AUTH_TOKEN: under Trusted Publishing
      # npm generates provenance attestations automatically, and the OIDC
      # exchange against the trusted-publisher connection on npmjs.com
      # (raccioly/docguard -> release.yml) IS the authentication.
      # --loglevel verbose so that if this fails again, the log shows which
      # auth path npm chose instead of leaving it to inference.
      - name: Publish (provenance is automatic under Trusted Publishing)
        run: npm publish --loglevel verbose

  # ── Step 6: Publish to PyPI ────────────────────────────────────────────
  publish-pypi:
    needs: [detect-version, test, create-release]
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing (OIDC) — same rationale as publish-npm: a stored
    # API token is a credential that expires silently and takes the release
    # pipeline down with it (see bug-256: NPM_TOKEN expired and cost seven
    # releases to diagnose). PYPI_API_TOKEN was last rotated 2026-03-15 and was
    # the next one due to do exactly that. Nothing here can expire.
    #
    # `environment` MUST match the Environment name configured in the PyPI
    # trusted publisher, and `id-token: write` is what mints the OIDC token.
    # Mirrors the working setup in raccioly/websec-validator's publish.yml.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync version in pyproject.toml
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          echo "Publishing version $VERSION"
          grep 'version' pyproject.toml

      - name: Install build tools
        run: pip install build

      - name: Build
        run: python -m build

      # Assert the OIDC precondition before publishing, rather than finding out
      # via an auth error that doesn't name the cause (the npm lesson).
      - name: Assert OIDC token is available
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is unset — this job lacks id-token: write, so PyPI Trusted Publishing cannot authenticate."
            exit 1
          fi
          echo "OIDC token endpoint available; publishing via Trusted Publishing."

      # No TWINE_USERNAME/TWINE_PASSWORD: the OIDC exchange against the trusted
      # publisher configured on PyPI (raccioly / docguard / release.yml /
      # environment: pypi) IS the authentication.
      # v1.14.2. Pinned by COMMIT sha (dereferenced from the annotated tag, not
      # the tag object's own sha -- those differ for annotated tags and pinning
      # the wrong one does not resolve).
      #
      # Do NOT pin this back to the older release/v1 sha used by
      # raccioly/websec-validator: that build's bundled twine rejects
      # `Metadata-Version: 2.5`, which current setuptools/build now emits --
      # "InvalidDistribution: '2.5' is not a valid metadata version". v0.34.8
      # failed exactly there. websec-validator still carries that old pin and
      # will hit the same wall whenever its setuptools moves forward.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  # ── Step 7: Prepare Spec Kit community catalog submission ──────────────
  # Per spec-kit maintainer guidance (github/spec-kit#2707) and spec-kit's
  # Extension Publishing Guide, a catalog add/update MUST go through the
  # Extension Submission ISSUE TEMPLATE so GitHub auto-applies the template
  # labels + auto-assigns a maintainer — NOT a direct PR editing
  # catalog.community.json (the old fork-sync + patch-catalog.py + gh pr
  # flow, now removed). This job does NOT touch github/spec-kit at all: it
  # builds a prefilled issue-form link and opens a one-click reminder issue
  # in THIS repo. A human submits the real form (so labels/assignment fire).
  sync-catalog:
    needs: [detect-version, build-extension, publish-npm, publish-pypi]
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # reminder issue in THIS repo only — never github/spec-kit
    steps:
      - name: Checkout docguard repo
        uses: actions/checkout@v7

      - name: Get version and metadata
        id: meta
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "download_url=https://github.com/raccioly/docguard/releases/download/v${VERSION}/spec-kit-docguard-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "✅ Version: $VERSION"

      - name: Build prefilled submission link + body
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          DOWNLOAD_URL="${{ steps.meta.outputs.download_url }}"
          python3 .github/scripts/speckit-submission.py --url "$VERSION" "$DOWNLOAD_URL" > /tmp/submit-url.txt
          python3 .github/scripts/speckit-submission.py --body "$VERSION" "$DOWNLOAD_URL" > /tmp/submit-body.md
          echo "✅ Built prefilled form URL ($(wc -c < /tmp/submit-url.txt) bytes) + body"

      - name: Open or refresh catalog-submission reminder (this repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SUBMIT_URL=$(cat /tmp/submit-url.txt)
          TITLE="📦 Submit DocGuard v${VERSION} to the spec-kit community catalog"

          # Compose the reminder body: one-click prefilled form link + the full
          # field-by-field body as a paste fallback (URL prefill can truncate).
          {
            echo "A new release (**v${VERSION}**) is out. Update the spec-kit"
            echo "community catalog **via the Extension Submission issue template**"
            echo "(NOT a PR — see github/spec-kit#2707)."
            echo
            echo "## 👉 One-click: open the prefilled submission form"
            echo
            echo "[**Open the Extension Submission form, prefilled for v${VERSION}**](${SUBMIT_URL})"
            echo
            echo "Then: review the fields, tick the two checkbox groups (Testing /"
            echo "Requirements), and click **Submit new issue**. Submitting through"
            echo "the form is what makes GitHub auto-apply labels and assign a"
            echo "maintainer. If any long field came through truncated, paste it"
            echo "from the copy below."
            echo
            echo "<details><summary>📋 Full submission body (copy/paste fallback)</summary>"
            echo
            cat /tmp/submit-body.md
            echo
            echo "</details>"
          } > /tmp/reminder.md

          # Idempotent per-version: refresh the existing reminder, else open one.
          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title \"DocGuard v${VERSION}\" spec-kit catalog" \
            --json number,title \
            --jq "[.[] | select(.title | contains(\"v${VERSION}\"))][0].number" 2>/dev/null || echo "")

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file /tmp/reminder.md
            echo "✅ Refreshed reminder issue #${EXISTING}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/reminder.md
            echo "✅ Opened catalog-submission reminder issue"
          fi

      - name: Write run summary
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SUBMIT_URL=$(cat /tmp/submit-url.txt)
          {
            echo "### Spec Kit catalog submission — v${VERSION}"
            echo
            echo "[Open the prefilled Extension Submission form](${SUBMIT_URL})"
            echo
            echo "Submit it through the form (do **not** open a PR against the catalog)."
          } >> "$GITHUB_STEP_SUMMARY"
