name: Scheduled Release

# Self-sustaining releases: batches whatever has landed on main since the last
# tag into a weekly patch release, instead of cutting a version per merge.
#
# WHY BATCHED AND NOT PER-MERGE: every release publishes to npm AND PyPI
# publicly. Per-merge releases would burn a version number per dependabot
# patch and publish constantly. Weekly batching keeps releases hands-off
# without turning the registry into a changelog.
#
# HOW IT TRIGGERS THE ACTUAL RELEASE: the repository token opens a protected PR,
# dispatches CI and supply-chain scans on its branch, and waits for those exact
# runs. The same trusted scheduler then restores policy from main, validates the
# candidate and run provenance as metadata, merges, and dispatches release.yml.
# A later schedule retries publication when package.json has no corresponding tag.
#
# NO-OP WHEN NOTHING CHANGED: if there are no commits since the last release
# tag, this exits without bumping — no empty releases.

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Check for unreleased changes
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if ! git ls-remote --tags origin "refs/tags/v$CURRENT" | grep -q "refs/tags/v$CURRENT$"; then
            echo "v$CURRENT is not published — dispatching idempotent release recovery."
            gh workflow run release.yml --ref main
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$LAST_TAG" ]; then
            echo "No tags yet — nothing to compare against, skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Commits since the last tag, excluding the release commits themselves
          # and the OpenWolf bookkeeping noise (.wolf/ is auto-written by hooks
          # every session and must never on its own justify a release).
          COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline -- . ':!.wolf' | grep -viE '^[0-9a-f]+ (release|chore\(release\)):' || true)
          COUNT=$(echo "$COMMITS" | grep -c . || true)

          echo "Last tag: $LAST_TAG"
          echo "Releasable commits since: $COUNT"
          echo "$COMMITS"

          if [ "$COUNT" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
            # Stash the log for the changelog entry
            echo "$COMMITS" > /tmp/commits.txt
          fi

      - name: Bump version and write changelog
        if: steps.check.outputs.changed == 'true'
        run: |
          BUMP="${{ inputs.bump || 'patch' }}"
          OLD="${{ steps.check.outputs.current }}"
          NEW=$(node -e "
            const [maj,min,pat] = '$OLD'.split('.').map(Number);
            console.log('$BUMP' === 'minor' ? \`\${maj}.\${min+1}.0\` : \`\${maj}.\${min}.\${pat+1}\`);
          ")
          echo "Bumping $OLD → $NEW"

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2) + '\n');
          "
          npm install --package-lock-only --ignore-scripts

          # Changelog entry from the commit subjects, so release.yml's notes
          # extractor (which reads the '## [VERSION]' section) has real content.
          {
            echo "## [$NEW] - $(date -u +%Y-%m-%d)"
            echo
            echo "Automated weekly release — batches everything merged since \`${{ steps.check.outputs.last_tag }}\`."
            echo
            echo "### Changed"
            echo
            sed -E 's/^[0-9a-f]+ /- /' /tmp/commits.txt
            echo
          } > /tmp/entry.md

          # Splice in directly under '## [Unreleased]'
          awk '/^## \[Unreleased\]/ { print; print ""; while ((getline line < "/tmp/entry.md") > 0) print line; next } { print }' \
            CHANGELOG.md > /tmp/CHANGELOG.new && mv /tmp/CHANGELOG.new CHANGELOG.md

          # Synchronize every active publication surface from package.json.
          # This is fail-closed: missing or duplicated fields stop the release
          # before any release metadata is written.
          node .github/scripts/sync-release-version.mjs
          # The extension skills are authoritative. Refresh their checked-in
          # `.agent` copies before the parity test and release commit.
          node --input-type=module -e "import { ensureSkills } from './cli/ensure-skills.mjs'; ensureSkills(process.cwd(), { format: 'json', noSpecKit: true });"

          echo "NEW_VERSION=$NEW" >> "$GITHUB_ENV"

      - name: Verify the tree is still green before releasing
        if: steps.check.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          node cli/docguard.mjs guard || [ $? -eq 2 ]

      # Main requires a PR and four runtime checks. A repository-token PR leaves
      # pull_request runs approval-gated, so dispatch CI and supply-chain checks
      # explicitly against the release branch. workflow_dispatch is the
      # documented GITHUB_TOKEN recursion exception. GitHub suppresses the later
      # workflow_run event for a bot-authored dispatch, so this trusted scheduler
      # waits for and verifies the exact runs before it merges.
      #
      #   1. main requires a pull request. github-actions[bot] is not an admin
      #      and has no bypass, so a direct push is rejected outright.
      - name: Open release PR and dispatch verification
        id: candidate
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/v${NEW_VERSION}"
          EXISTING=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -n "$EXISTING" ]; then
            echo "Reusing existing release PR: $EXISTING"
            git fetch origin "$BRANCH"
            if ! git merge-base --is-ancestor HEAD "origin/$BRANCH"; then
              echo "::error::Existing $BRANCH does not contain current main; refusing to validate a stale release."
              exit 1
            fi
            PR_NUMBER=$(gh pr view "$EXISTING" --json number --jq .number)
            HEAD_SHA=$(gh pr view "$EXISTING" --json headRefOid --jq .headRefOid)
          else
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo "::error::Remote branch $BRANCH exists without an open PR; refusing to overwrite it."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add package.json package-lock.json pyproject.toml server.json CHANGELOG.md templates/ extensions/ .agent/ 2>/dev/null || true
            git commit -m "release: v${NEW_VERSION} — automated weekly batch

            Cut by .github/workflows/scheduled-release.yml. Publishing itself is
            handled by release.yml after exact-run policy verification."
            git push origin "$BRANCH"

            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "release: v${NEW_VERSION} — automated weekly batch" \
              --body "Automated weekly release cut by \`scheduled-release.yml\`.

            Batches everything merged since \`${{ steps.check.outputs.last_tag }}\`. Tests and \`guard\` already passed on this tree before the PR was opened. CI and supply-chain verification are explicitly dispatched on this branch.

            Once both exact runs pass, the trusted scheduler validates release metadata, merges this PR, and dispatches \`release.yml\` to tag and publish.")
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq .number)
            HEAD_SHA=$(git rev-parse HEAD)
          fi

          latest_run_id() {
            gh run list --workflow "$1" --branch "$BRANCH" --event workflow_dispatch --limit 20 \
              --json databaseId,headSha | jq --arg sha "$HEAD_SHA" \
              '[.[] | select(.headSha == $sha) | .databaseId] | max // 0'
          }
          wait_for_new_run() {
            WORKFLOW="$1"
            BEFORE="$2"
            for _ in $(seq 1 30); do
              RUN_ID=$(latest_run_id "$WORKFLOW")
              if [ "$RUN_ID" -gt "$BEFORE" ]; then
                echo "$RUN_ID"
                return 0
              fi
              sleep 2
            done
            echo "::error::$WORKFLOW dispatch was not observable within 60 seconds." >&2
            return 1
          }

          wait_for_pr_registration() {
            WORKFLOW="$1"
            for _ in $(seq 1 30); do
              REGISTERED=$(gh run list --workflow "$WORKFLOW" --branch "$BRANCH" --event pull_request --limit 20 \
                --json databaseId,headSha | jq --arg sha "$HEAD_SHA" \
                '[.[] | select(.headSha == $sha)] | length')
              if [ "$REGISTERED" -gt 0 ]; then
                return 0
              fi
              sleep 2
            done
            echo "::error::$WORKFLOW pull-request check registration was not observable within 60 seconds." >&2
            return 1
          }

          # GitHub creates approval-required placeholder runs for a PR opened by
          # GITHUB_TOKEN. Wait until those check contexts exist, then dispatch the
          # trusted runs so their successful checks are the newest contexts used
          # by branch protection.
          wait_for_pr_registration ci.yml
          wait_for_pr_registration supply-chain.yml
          CI_BEFORE=$(latest_run_id ci.yml)
          SUPPLY_BEFORE=$(latest_run_id supply-chain.yml)
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run supply-chain.yml --ref "$BRANCH"
          CI_RUN_ID=$(wait_for_new_run ci.yml "$CI_BEFORE")
          SUPPLY_RUN_ID=$(wait_for_new_run supply-chain.yml "$SUPPLY_BEFORE")

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "supply_run_id=$SUPPLY_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Opened $BRANCH and dispatched exact CI ($CI_RUN_ID) and supply-chain ($SUPPLY_RUN_ID) runs."

      - name: Wait for exact CI
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run watch "${{ steps.candidate.outputs.ci_run_id }}" --exit-status

      - name: Wait for exact supply-chain scan
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run watch "${{ steps.candidate.outputs.supply_run_id }}" --exit-status

      - name: Check out trusted release controller
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate, merge, and dispatch publication
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          RELEASE_HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          RELEASE_HEAD_BRANCH: ${{ steps.candidate.outputs.head_branch }}
          RELEASE_CI_RUN_ID: ${{ steps.candidate.outputs.ci_run_id }}
          RELEASE_SUPPLY_RUN_ID: ${{ steps.candidate.outputs.supply_run_id }}
        with:
          script: |
            const policyPath = process.env.GITHUB_WORKSPACE + '/cli/release-pr-policy.mjs';
            const { evaluateReleaseCandidate, evaluateReleaseJobs, evaluateReleaseRun } = await import(policyPath);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = `${owner}/${repo}`;
            const prNumber = Number(process.env.RELEASE_PR_NUMBER);
            const ciRunId = Number(process.env.RELEASE_CI_RUN_ID);
            const supplyRunId = Number(process.env.RELEASE_SUPPLY_RUN_ID);
            if (![prNumber, ciRunId, supplyRunId].every(Number.isSafeInteger)) {
              throw new Error('Release controller received invalid numeric identifiers.');
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.state !== 'open') throw new Error(`#${prNumber} is not open.`);
            if (pr.head.sha !== process.env.RELEASE_HEAD_SHA || pr.head.ref !== process.env.RELEASE_HEAD_BRANCH) {
              throw new Error(`#${prNumber} head changed after dispatch.`);
            }

            const runExpectations = [
              [ciRunId, 'DocGuard CI', '.github/workflows/ci.yml'],
              [supplyRunId, 'Supply-Chain Security', '.github/workflows/supply-chain.yml'],
            ];
            for (const [runId, workflowName, workflowPath] of runExpectations) {
              const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
              const result = evaluateReleaseRun(run, {
                runId, workflowName, workflowPath, repository,
                headSha: pr.head.sha, headBranch: pr.head.ref,
              });
              if (!result.ok) throw new Error(`${workflowName} provenance rejected: ${result.errors.join(', ')}`);
            }

            const { data: runJobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: ciRunId, filter: 'latest', per_page: 100,
            });
            const jobPolicy = evaluateReleaseJobs(runJobs.jobs);
            if (!jobPolicy.ok) throw new Error(`Exact CI jobs rejected: ${jobPolicy.errors.join(', ')}`);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const paths = files.map((file) => file.filename);
            const textAt = async (path, ref) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (Array.isArray(data) || !data.content) throw new Error(`${path}: expected a file`);
              return Buffer.from(data.content, 'base64').toString('utf8');
            };
            const candidateFiles = {
              packageJson: await textAt('package.json', pr.head.sha),
              packageLock: await textAt('package-lock.json', pr.head.sha),
              pyproject: await textAt('pyproject.toml', pr.head.sha),
              server: await textAt('server.json', pr.head.sha),
              extension: await textAt('extensions/spec-kit-docguard/extension.yml', pr.head.sha),
            };
            const baseVersion = JSON.parse(await textAt('package.json', pr.base.sha)).version;
            const preliminary = evaluateReleaseCandidate({
              repository, headRepo: pr.head.repo.full_name,
              defaultBranch: context.payload.repository.default_branch,
              baseRef: pr.base.ref, headRef: pr.head.ref, title: pr.title,
              author: pr.user.login, baseVersion, paths, files: candidateFiles,
              tagExists: false,
            });
            let tagExists = false;
            if (preliminary.version && /^\d+\.\d+\.\d+$/.test(preliminary.version)) {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `tags/v${preliminary.version}` });
                tagExists = true;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const candidatePolicy = evaluateReleaseCandidate({
              repository, headRepo: pr.head.repo.full_name,
              defaultBranch: context.payload.repository.default_branch,
              baseRef: pr.base.ref, headRef: pr.head.ref, title: pr.title,
              author: pr.user.login, baseVersion, paths, files: candidateFiles,
              tagExists,
            });
            if (!candidatePolicy.ok) {
              throw new Error(`Release candidate rejected: ${candidatePolicy.errors.join(', ')}`);
            }

            const { data: merge } = await github.rest.pulls.merge({
              owner, repo, pull_number: prNumber, merge_method: 'squash',
            });
            if (!merge.merged) throw new Error(merge.message || 'GitHub declined the merge.');
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'release.yml',
                ref: context.payload.repository.default_branch,
              });
            } catch (error) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `⚠️ **Merged, publication dispatch failed** — ${error.message}. The next scheduled run will retry the untagged version.`,
              });
              throw error;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: `🤖 **Auto-merged by the trusted scheduler** — exact CI run ${ciRunId} and supply-chain run ${supplyRunId} passed for ${pr.head.sha}. Publication was dispatched on main.`,
            });
            core.notice(`Merged #${prNumber} and dispatched publication.`);
