name: Auto-merge (green bot PRs)

# Hands-off merging for bot PRs that have ALREADY passed the full CI matrix.
#
# WHY workflow_run AND NOT `gh pr merge --auto`: GitHub's native auto-merge
# requires the repo-level `allow_auto_merge` setting plus REQUIRED status
# checks in branch protection. Without required checks configured, `--auto`
# merges IMMEDIATELY without waiting for CI — worse than merging by hand.
# This workflow instead fires only after "DocGuard CI" reports success for
# the head SHA, re-verifies every matrix leg via the API, and merges itself.
# No repo settings required, and it is fail-closed: anything unexpected → skip.
#
# SECURITY: workflow_run runs in the BASE repo context with write scope. It
# checks out only the default branch policy with persisted credentials disabled,
# then reads PR metadata and candidate files as inert API data. It never checks
# out or executes PR code.
#
# WHAT AUTO-MERGES:
#   - dependabot: patch + minor only. Majors NEVER (v0.34.1 shipped a Node-18
#     break from an auto-accepted @babel/parser major; bug-255).
#   - jules: test-only and docs-only changes. Anything touching cli/ logic,
#     .github/, or package.json is labeled and left for a human.
#   - release: exact scheduler-owned next-version surfaces after a maintainer
#     approves the repository-token PR's ordinary pull-request CI.

on:
  workflow_run:
    workflows: ["DocGuard CI"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate and merge if safe
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const policyPath = process.env.GITHUB_WORKSPACE + '/cli/release-pr-policy.mjs';
            const { evaluateReleaseCandidate, evaluateReleaseJobs } = await import(policyPath);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;

            // ── Locate the PR for this CI run ────────────────────────────
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: headSha,
            });
            const pr = prs.find((p) => p.state === 'open');
            if (!pr) { core.info('No open PR for this SHA — nothing to do.'); return; }
            const num = pr.number;
            const author = pr.user.login;

            const BOT_DEPENDABOT = 'dependabot[bot]';
            const BOT_JULES = 'google-labs-jules[bot]';
            const releaseShape = pr.head.repo.full_name === `${owner}/${repo}` &&
              /^release\/v\d+\.\d+\.\d+$/.test(pr.head.ref || '') &&
              /^release: v\d+\.\d+\.\d+ — automated weekly batch$/.test(pr.title || '');
            if (run.event === 'workflow_dispatch' && !releaseShape) {
              core.info(`#${num} is not a release PR — dispatched recovery CI cannot auto-merge it.`);
              return;
            }
            if (![BOT_DEPENDABOT, BOT_JULES].includes(author) && !releaseShape) {
              core.info(`#${num} authored by ${author} (not a handled bot) — leaving alone.`);
              return;
            }

            const hold = async (label, why) => {
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: num, labels: [label] });
              } catch (e) { core.info(`label skipped: ${e.message}`); }
              await github.rest.issues.createComment({
                owner, repo, issue_number: num,
                body: `⏸️ **Held for human review** — ${why}\n\nCI is green, but this falls outside the auto-merge policy in \`.github/workflows/auto-merge.yml\`.`,
              });
              core.notice(`#${num} held: ${why}`);
            };

            // ── Re-verify this exact workflow run independently ───────────
            if (headSha !== pr.head.sha || run.head_branch !== pr.head.ref) {
              core.info(`#${num} not merging — triggering run does not match the current PR head.`);
              return;
            }
            const { data: runJobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            const jobPolicy = evaluateReleaseJobs(runJobs.jobs);
            if (!jobPolicy.ok) {
              core.info(`#${num} not merging — exact-run checks failed: ${jobPolicy.errors.join(', ')}`);
              return;
            }

            // ── Scope gate: what files does this PR touch? ───────────────
            const { data: files } = await github.rest.pulls.listFiles({
              owner, repo, pull_number: num, per_page: 300,
            });
            const paths = files.map((f) => f.filename);

            if (releaseShape) {
              const textAt = async (path, ref) => {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
                if (Array.isArray(data) || !data.content) throw new Error(`${path}: expected a file`);
                return Buffer.from(data.content, 'base64').toString('utf8');
              };
              try {
                const candidateFiles = {
                  packageJson: await textAt('package.json', headSha),
                  packageLock: await textAt('package-lock.json', headSha),
                  pyproject: await textAt('pyproject.toml', headSha),
                  server: await textAt('server.json', headSha),
                  extension: await textAt('extensions/spec-kit-docguard/extension.yml', headSha),
                };
                const baseVersion = JSON.parse(await textAt('package.json', pr.base.sha)).version;
                const policyInput = {
                  repository: `${owner}/${repo}`,
                  headRepo: pr.head.repo.full_name,
                  defaultBranch: context.payload.repository.default_branch,
                  baseRef: pr.base.ref,
                  headRef: pr.head.ref,
                  title: pr.title,
                  author,
                  baseVersion,
                  paths,
                  files: candidateFiles,
                  tagExists: false,
                };
                const preliminary = evaluateReleaseCandidate(policyInput);
                let tagExists = false;
                if (preliminary.version && /^\d+\.\d+\.\d+$/.test(preliminary.version)) {
                  try {
                    await github.rest.git.getRef({ owner, repo, ref: `tags/v${preliminary.version}` });
                    tagExists = true;
                  } catch (e) {
                    if (e.status !== 404) throw e;
                  }
                }
                const candidatePolicy = evaluateReleaseCandidate({ ...policyInput, tagExists });
                if (!candidatePolicy.ok) {
                  await hold('needs-review', `release policy rejected the candidate:\n${candidatePolicy.errors.map((error) => `- ${error}`).join('\n')}`);
                  return;
                }
                core.info(`#${num} authenticated tokenless release PR (${pr.head.ref}) — eligible.`);
              } catch (e) {
                await hold('needs-review', `release metadata could not be verified: ${e.message}`);
                return;
              }
            } else if (author === BOT_DEPENDABOT) {
              // Version delta from the title: "bump X from 1.2.3 to 1.2.4"
              const m = /from (\d+)\.(\d+)\.(\d+)\S* to (\d+)\.(\d+)\.(\d+)/.exec(pr.title || '');
              if (!m) { await hold('needs-review', 'could not parse the version delta from the PR title.'); return; }
              const [fromMaj, fromMin] = [Number(m[1]), Number(m[2])];
              const [toMaj, toMin] = [Number(m[4]), Number(m[5])];
              if (toMaj !== fromMaj) {
                await hold('needs-review', `this is a **major** bump (${m[1]}.${m[2]}.${m[3]} → ${m[4]}.${m[5]}.${m[6]}). Majors are never auto-merged — a @babel/parser major silently dropped Node 18 support and broke a release (bug-255).`);
                return;
              }
              core.info(`#${num} dependabot ${toMin !== fromMin ? 'minor' : 'patch'} bump — eligible.`);
            } else {
              // Jules: only test-only / docs-only changes auto-merge.
              const risky = paths.filter((p) =>
                !(p.startsWith('tests/') || p.startsWith('docs/') || p.endsWith('.md'))
              );
              if (risky.length) {
                await hold('jules-review', `it changes non-test/non-doc files:\n${risky.map((p) => `- \`${p}\``).join('\n')}\n\nProduction-logic changes from an agent get a human read before they ship to npm.`);
                return;
              }
              core.info(`#${num} jules test/docs-only (${paths.length} files) — eligible.`);
            }

            // ── Merge ────────────────────────────────────────────────────
            try {
              const { data: merge } = await github.rest.pulls.merge({
                owner, repo, pull_number: num, merge_method: 'squash',
              });
              if (!merge.merged) throw new Error(merge.message || 'GitHub declined the merge');
              if (releaseShape) {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner,
                    repo,
                    workflow_id: 'release.yml',
                    ref: context.payload.repository.default_branch,
                  });
                } catch (dispatchError) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: num,
                    body: `⚠️ **Merged, publication dispatch failed** — ${dispatchError.message}. The next scheduled release run will retry the untagged package version.`,
                  });
                  core.setFailed(`Merged #${num}, but release dispatch failed: ${dispatchError.message}`);
                  return;
                }
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: num,
                body: `🤖 **Auto-merged** — the exact CI run passed all four Node legs (18/20/22/24), stayed within the test-runtime budget, and satisfied the policy in \`.github/workflows/auto-merge.yml\`.${releaseShape ? ' Publication was dispatched on main.' : ''}`,
              });
              core.notice(`Merged #${num}.`);
            } catch (e) {
              core.warning(`Merge of #${num} failed: ${e.message}`);
              await hold('needs-review', `auto-merge failed: \`${e.message}\``);
            }
